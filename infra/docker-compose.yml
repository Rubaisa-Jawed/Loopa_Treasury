version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: pilot_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
